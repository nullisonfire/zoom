name = "cloudflare-zoom"
main = "worker/src/index.ts"
compatibility_date = "2026-10-03"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:5173"
ALLOWED_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "zoom-db"
database_id = "REPLACE_WITH_DEV_D1_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MEETING_ROOMS"
class_name = "MeetingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingRoom"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "zoom-media-storage"

[env.production]
name = "cloudflare-zoom-production"

[env.production.vars]
ENVIRONMENT = "production"
APP_URL = "https://zoom-d43.pages.dev"
ALLOWED_ORIGIN = "https://zoom-d43.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "zoom-db-production"
database_id = "5cb7bc0f-ffe3-4232-8523-20972b2ea64a"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "MEETING_ROOMS"
class_name = "MeetingRoom"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingRoom"]

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "zoom-media-storage-prod"
